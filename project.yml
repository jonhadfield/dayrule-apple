name: Dayrule
options:
  bundleIdPrefix: app.dayrule
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.11.0"
targets:
  Dayrule:
    type: application
    platform: iOS
    sources:
      - path: Dayrule
        excludes:
          - "**/.DS_Store"
          - "Crypto/bip39-english.txt"
          - "Fonts/**"
          - "Resources/**"
    resources:
      - path: Dayrule/Fonts
      - path: Dayrule/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: Sodium
        product: Clibsodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayrule.Dayrule
        INFOPLIST_KEY_CFBundleDisplayName: Dayrule
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
        INFOPLIST_KEY_UIAppFonts: Fraunces-Variable.ttf
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - DayruleTests
        - DayruleUITests
  DayruleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DayruleTests
    dependencies:
      - target: Dayrule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayrule.DayruleTests
        GENERATE_INFOPLIST_FILE: YES
  DayruleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DayruleUITests
    dependencies:
      - target: Dayrule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayrule.DayruleUITests
        GENERATE_INFOPLIST_FILE: YES
