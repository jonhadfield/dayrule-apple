name: Dayrule
options:
  bundleIdPrefix: uk.co.lessknown
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 26
    MARKETING_VERSION: "0.1.1"
    DEVELOPMENT_TEAM: VBZY8FBYR5
    CODE_SIGN_STYLE: Automatic
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.11.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
targets:
  Dayrule:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Dayrule
        excludes:
          - "**/.DS_Store"
          - "Crypto/bip39-english.txt"
          - "Fonts/**"
          - "Resources/**"
      # XcodeGen multiplatform targets omit top-level `resources:`; ship as resource sources.
      - path: Dayrule/Fonts
        buildPhase: resources
        excludes:
          - "**/.DS_Store"
      - path: Dayrule/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
        destinationFilters: [iOS]
      - path: Dayrule/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: Sodium
        product: Clibsodium
      - package: GRDB
        product: GRDB
      - target: DayruleShare
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.lessknown.dayrule
        DEVELOPMENT_TEAM: VBZY8FBYR5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Dayrule/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        # macOS-only (sdk-conditioned); App Sandbox + network client.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Dayrule/Resources/Dayrule-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Dayrule/Resources/Dayrule-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Dayrule/Resources/Dayrule.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # Strip / keep NSAllowsLocalNetworking via Info.plist preprocess (PLAN §9.6).
        INFOPLIST_PREPROCESS: YES
      configs:
        Debug:
          INFOPLIST_OTHER_PREPROCESSOR_FLAGS: "-DDAYRULE_DEBUG_ATS"
    postCompileScripts:
      - name: Embed git commit
        basedOnDependencyAnalysis: false
        script: |
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "${PLIST}" ]; then
            echo "note: Info.plist not at ${PLIST} yet; skipping git stamp"
            exit 0
          fi
          COMMIT=$(git -C "${SRCROOT}" rev-parse --short=12 HEAD 2>/dev/null || echo unknown)
          /usr/libexec/PlistBuddy -c "Set :DayruleGitCommit ${COMMIT}" "${PLIST}" \
            || /usr/libexec/PlistBuddy -c "Add :DayruleGitCommit string ${COMMIT}" "${PLIST}"
    scheme:
      testTargets:
        - DayruleTests
        - DayruleUITests
  DayruleShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DayruleShare
      - path: Dayrule/ShareInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.lessknown.dayrule.share
        DEVELOPMENT_TEAM: VBZY8FBYR5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DayruleShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: DayruleShare/DayruleShare.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  DayruleTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: DayruleTests
    dependencies:
      - target: Dayrule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.lessknown.dayrule.tests
        GENERATE_INFOPLIST_FILE: YES
        # Multiplatform host path: iOS puts the binary at .app root; macOS under Contents/MacOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dayrule.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dayrule"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DayruleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: DayruleUITests
    dependencies:
      - target: Dayrule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.lessknown.dayrule.uitests
        GENERATE_INFOPLIST_FILE: YES
        # XCUIApplication is MainActor-isolated on Xcode 16.4; keep tests annotated @MainActor.
        SWIFT_STRICT_CONCURRENCY: complete
