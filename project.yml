name: Dayrule
options:
  bundleIdPrefix: app.dayrule
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.11.0"
targets:
  Dayrule:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Dayrule
        excludes:
          - "**/.DS_Store"
          - "Crypto/bip39-english.txt"
          - "Fonts/**"
          - "Resources/**"
    resources:
      - path: Dayrule/Fonts
      - path: Dayrule/Resources/PrivacyInfo.xcprivacy
        destinationFilters: [iOS]
    dependencies:
      - package: Sodium
        product: Clibsodium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayrule.Dayrule
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Dayrule/Resources/Info.plist
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        # macOS-only (sdk-conditioned); App Sandbox + network client.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Dayrule/Resources/Dayrule.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
    scheme:
      testTargets:
        - DayruleTests
        - DayruleUITests
  DayruleTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: DayruleTests
    dependencies:
      - target: Dayrule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayrule.DayruleTests
        GENERATE_INFOPLIST_FILE: YES
        # Multiplatform host path: iOS puts the binary at .app root; macOS under Contents/MacOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dayrule.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Dayrule"
        BUNDLE_LOADER: "$(TEST_HOST)"
  DayruleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: DayruleUITests
    dependencies:
      - target: Dayrule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayrule.DayruleUITests
        GENERATE_INFOPLIST_FILE: YES
