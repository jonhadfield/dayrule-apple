name: Local sync e2e

# PLAN §14.2: checkout public dayrule @ SHARED.lock, Postgres, serve-api,
# SyncE2E + SyncUITests. Local: E2E_DATABASE_URL=… ./scripts/local-sync-e2e.sh
# Not on every main push: intermittent sim/xcodebuild hangs billed macOS
# minutes (decision 45/46). Run weekly, manually before TestFlight, or locally.
on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — cheap recurring check without merge-time hangs.
    - cron: '0 6 * * 1'

# contents:read only — no actions:write, so this job cannot poison the
# default-branch Actions cache even though schedule/workflow_dispatch run in
# that cache scope. CodeQL still flags checkout+exec of the SHARED.lock pin
# (alert #1); that pin is reviewed in this repo, not a dispatch input.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-e2e:
    runs-on: macos-15
    # Healthy e2e finishes in ~5–8m; hung runs previously billed the full 60m job
    # timeout. Cap hard so a stuck sim/xcodebuild cannot.
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read SHARED.lock web commit
        timeout-minutes: 1
        id: lock
        run: |
          set -euo pipefail
          sha="$(sed -n 's/^web_commit=//p' docs/shared/SHARED.lock)"
          # Full object name required — short SHAs are fetched as branch globs.
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "SHARED.lock web_commit must be a full 40-char SHA, got: $sha" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # path must not be "dayrule": macos runners are case-insensitive, so that
      # would clobber the native Dayrule/ source tree.
      - name: Checkout dayrule at SHARED.lock
        timeout-minutes: 2
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jonhadfield/dayrule
          ref: ${{ steps.lock.outputs.sha }}
          path: dayrule-web
          persist-credentials: false

      # Defense in depth: pin must sit on public dayrule main history (not an
      # arbitrary object). Use gh+GITHUB_TOKEN — bare curl to api.github.com
      # gets 403 from Actions runners.
      - name: Verify SHARED.lock pin is on dayrule main
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.lock.outputs.sha }}"
          git -C dayrule-web remote -v | grep -F 'jonhadfield/dayrule' >/dev/null
          status="$(gh api "repos/jonhadfield/dayrule/compare/main...${sha}" --jq .status)"
          case "$status" in
            identical|behind) echo "pin $sha is on dayrule main ($status)" ;;
            *)
              echo "SHARED.lock web_commit $sha is not on dayrule main (compare status=$status)" >&2
              exit 1
              ;;
          esac

      - name: Select Xcode
        timeout-minutes: 1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Postgres and tools
        timeout-minutes: 5
        run: |
          set -euo pipefail
          brew install postgresql@17 xcodegen go
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          brew services start postgresql@17
          # brew services returns before the server accepts connections.
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -q; then
              break
            fi
            sleep 1
          done
          pg_isready -h 127.0.0.1
          # Prefer 127.0.0.1 over localhost (avoids [::1] vs IPv4 mismatches).
          if ! psql -h 127.0.0.1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='dayrule_e2e'" | grep -q 1; then
            createdb -h 127.0.0.1 dayrule_e2e
          fi
          psql -h 127.0.0.1 -d dayrule_e2e -c 'SELECT 1'

      - name: Run local sync e2e
        # 2026-11-16 weekly run clipped mid-SyncUITests at 8m; leave headroom.
        timeout-minutes: 12
        env:
          DAYRULE_WEB: ${{ github.workspace }}/dayrule-web
          E2E_DATABASE_URL: postgres://127.0.0.1/dayrule_e2e?sslmode=disable
          DAYRULE_API: http://127.0.0.1:8080
          DAYRULE_E2E: "1"
          DAYRULE_HIBP_STUB: "1"
        run: ./scripts/local-sync-e2e.sh
