name: Local sync e2e

# Manual for now (PLAN §14.2): needs a dayrule checkout + throwaway Postgres.
# Local: E2E_DATABASE_URL=… ./scripts/local-sync-e2e.sh
on:
  workflow_dispatch:

jobs:
  sync-e2e:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Checkout dayrule at SHARED.lock
        env:
          DAYRULE_WEB_TOKEN: ${{ secrets.DAYRULE_WEB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(sed -n 's/^web_commit=//p' docs/shared/SHARED.lock)
          if [ -n "${DAYRULE_WEB_TOKEN:-}" ]; then
            git clone --depth 1 "https://x-access-token:${DAYRULE_WEB_TOKEN}@github.com/jonhadfield/dayrule.git" "$RUNNER_TEMP/dayrule"
          else
            git clone --depth 1 https://github.com/jonhadfield/dayrule.git "$RUNNER_TEMP/dayrule"
          fi
          git -C "$RUNNER_TEMP/dayrule" fetch --depth 1 origin "$SHA"
          git -C "$RUNNER_TEMP/dayrule" checkout "$SHA"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Postgres and tools
        run: |
          brew install postgresql@17 xcodegen go
          brew services start postgresql@17
          createdb dayrule_e2e || true

      - name: Run local sync e2e
        env:
          DAYRULE_WEB: ${{ runner.temp }}/dayrule
          E2E_DATABASE_URL: postgres://localhost/dayrule_e2e?sslmode=disable
          DAYRULE_API: http://127.0.0.1:8080
        run: ./scripts/local-sync-e2e.sh
