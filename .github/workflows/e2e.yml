name: Local sync e2e

# PLAN §14.2: checkout dayrule @ SHARED.lock, Postgres, serve-api, SyncE2E + SyncUITests.
# Local: E2E_DATABASE_URL=… ./scripts/local-sync-e2e.sh
#
# Requires repo secret DAYRULE_WEB_TOKEN: a fine-grained PAT (or classic) with
# Contents: Read on the private jonhadfield/dayrule repo. The default
# GITHUB_TOKEN cannot clone that repo.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-e2e:
    runs-on: macos-15
    # Was 60m and hung runs billed the full hour. Cap hard; fail the step sooner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read SHARED.lock web commit
        timeout-minutes: 1
        id: lock
        run: echo "sha=$(sed -n 's/^web_commit=//p' docs/shared/SHARED.lock)" >> "$GITHUB_OUTPUT"

      # path must not be "dayrule": macos runners are case-insensitive, so that
      # would clobber the native Dayrule/ source tree.
      - name: Checkout dayrule at SHARED.lock
        timeout-minutes: 3
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: jonhadfield/dayrule
          ref: ${{ steps.lock.outputs.sha }}
          token: ${{ secrets.DAYRULE_WEB_TOKEN }}
          path: dayrule-web
          persist-credentials: false

      - name: Select Xcode
        timeout-minutes: 2
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Postgres and tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          brew install postgresql@17 xcodegen go
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          brew services start postgresql@17
          # brew services returns before the server accepts connections.
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -q; then
              break
            fi
            sleep 1
          done
          pg_isready -h 127.0.0.1
          # Prefer 127.0.0.1 over localhost (avoids [::1] vs IPv4 mismatches).
          if ! psql -h 127.0.0.1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='dayrule_e2e'" | grep -q 1; then
            createdb -h 127.0.0.1 dayrule_e2e
          fi
          psql -h 127.0.0.1 -d dayrule_e2e -c 'SELECT 1'

      - name: Run local sync e2e
        timeout-minutes: 20
        env:
          DAYRULE_WEB: ${{ github.workspace }}/dayrule-web
          E2E_DATABASE_URL: postgres://127.0.0.1/dayrule_e2e?sslmode=disable
          DAYRULE_API: http://127.0.0.1:8080
        run: ./scripts/local-sync-e2e.sh
