name: CI

# Cost: macOS minutes dominate. Run only on PRs (not again on main merge),
# skip docs/version-only diffs, honour ci-skip, and use one macos-15 job
# (shared setup → Mac build → iOS unit tests). See PLAN decision 65.
on:
  pull_request:
    paths-ignore:
      # Workflow is skipped only when *every* changed file matches these.
      - "docs/**"
      - "claudedocs/**"
      - ".agents/**"
      - "**/*.md"
      - "**/*.png"
      - "skills-lock.json"
      - "project.yml"
      - "Dayrule.xcodeproj/**"
  workflow_dispatch:

permissions:
  contents: read

# Drop superseded runs so a hung macOS job does not keep billing after the
# next push (web CI does the same). macOS runners are the expensive part.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Label escape hatch for WIP PRs that touch code but should not bill yet.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.pull_request.labels.*.name, 'ci-skip')
    runs-on: macos-15
    # Healthy serial run ~5–8m. Worst-case budget: checkout (3) + six capped
    # steps (1+1+1+3+3+4=13) + Test iOS (15) ≈ 31m, plus a little runner slack.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        timeout-minutes: 3

      - name: Select Xcode
        timeout-minutes: 1
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        timeout-minutes: 1
        run: xcodebuild -version

      - name: Verify shared fixture lock
        timeout-minutes: 1
        run: |
          set -euo pipefail
          while read -r line; do
            case "$line" in
              web_commit=*)
                sha="${line#web_commit=}"
                # Abbreviated pins break actions/checkout in Local sync e2e.
                [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "SHARED.lock web_commit must be a full 40-char SHA, got: $sha" >&2
                  exit 1
                }
                ;;
              *)
                hash="${line%%  *}"
                file="${line#*  }"
                actual="$(shasum -a 256 "docs/shared/$file" | awk '{print $1}')"
                test "$hash" = "$actual"
                ;;
            esac
          done < docs/shared/SHARED.lock

      - name: Generate project
        timeout-minutes: 3
        run: brew install xcodegen && xcodegen generate

      - name: Resolve packages
        timeout-minutes: 3
        run: xcodebuild -resolvePackageDependencies -project Dayrule.xcodeproj -scheme Dayrule

      - name: Build macOS
        timeout-minutes: 4
        run: |
          xcodebuild build \
            -project Dayrule.xcodeproj \
            -scheme Dayrule \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      # Hung simctl/xcodebuild must fail well under the job budget. bootstatus
      # gets its own wall clock via perl alarm (macOS has no GNU timeout).
      - name: Test iOS
        # Successful runs land around 6–7m. Step may use the full 15m; job
        # timeout (35m) = checkout + earlier capped steps + this step.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          devices=json.load(sys.stdin)['devices']
          # Prefer iPhone 16 on iOS 18+ (deployment target).
          candidates=[]
          for runtime,devs in devices.items():
            m=re.search(r'iOS[^\d]*(\d+)', runtime)
            if not m or int(m.group(1)) < 18: continue
            for d in devs:
              if d.get('isAvailable') and 'iPhone' in d['name']:
                score = 0
                if 'iPhone 16' in d['name']: score += 10
                if 'Pro' in d['name']: score += 1
                candidates.append((score, d['udid'], d['name']))
          if not candidates:
            raise SystemExit('no iPhone simulator on iOS 18+')
          candidates.sort(reverse=True)
          print(candidates[0][1])
          ")
          echo "Using simulator $UDID"
          # Erase + boot can stall on shared runners; retry once before giving up.
          boot_sim() {
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl erase "$UDID"
            xcrun simctl boot "$UDID"
            perl -e 'alarm shift; exec @ARGV' 180 xcrun simctl bootstatus "$UDID" -b
          }
          boot_sim || boot_sim
          xcodebuild test \
            -project Dayrule.xcodeproj \
            -scheme Dayrule \
            -destination "platform=iOS Simulator,id=$UDID" \
            -skip-testing:DayruleUITests \
            CODE_SIGNING_ALLOWED=NO
