name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Drop superseded runs so a hung macOS job does not keep billing after the
# next push (web CI does the same). macOS runners are the expensive part.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared setup is duplicated across jobs so Build macOS and Test iOS overlap
# (wall-clock). Each job stays self-contained — no DerivedData artifacts.
# Keep job budgets tight: hung simctl/xcodebuild has burned hour-long macOS
# minutes before (decision 33, 45).
jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Xcode
        timeout-minutes: 2
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify shared fixture lock
        timeout-minutes: 1
        run: |
          set -euo pipefail
          while read -r line; do
            case "$line" in
              web_commit=*) ;;
              *)
                hash="${line%%  *}"
                file="${line#*  }"
                actual="$(shasum -a 256 "docs/shared/$file" | awk '{print $1}')"
                test "$hash" = "$actual"
                ;;
            esac
          done < docs/shared/SHARED.lock

      - name: Generate project
        timeout-minutes: 5
        run: brew install xcodegen && xcodegen generate

      - name: Resolve packages
        timeout-minutes: 5
        run: xcodebuild -resolvePackageDependencies -project Dayrule.xcodeproj -scheme Dayrule

      - name: Build macOS
        timeout-minutes: 8
        run: |
          xcodebuild build \
            -project Dayrule.xcodeproj \
            -scheme Dayrule \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  test-ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Select Xcode
        timeout-minutes: 2
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify shared fixture lock
        timeout-minutes: 1
        run: |
          set -euo pipefail
          while read -r line; do
            case "$line" in
              web_commit=*) ;;
              *)
                hash="${line%%  *}"
                file="${line#*  }"
                actual="$(shasum -a 256 "docs/shared/$file" | awk '{print $1}')"
                test "$hash" = "$actual"
                ;;
            esac
          done < docs/shared/SHARED.lock

      - name: Generate project
        timeout-minutes: 5
        run: brew install xcodegen && xcodegen generate

      - name: Resolve packages
        timeout-minutes: 5
        run: xcodebuild -resolvePackageDependencies -project Dayrule.xcodeproj -scheme Dayrule

      # Hung simctl/xcodebuild must fail well under the job budget. bootstatus
      # gets its own wall clock via perl alarm (macOS has no GNU timeout).
      - name: Test iOS
        timeout-minutes: 18
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          devices=json.load(sys.stdin)['devices']
          # Prefer iPhone 16 on iOS 18+ (deployment target).
          candidates=[]
          for runtime,devs in devices.items():
            m=re.search(r'iOS[^\d]*(\d+)', runtime)
            if not m or int(m.group(1)) < 18: continue
            for d in devs:
              if d.get('isAvailable') and 'iPhone' in d['name']:
                score = 0
                if 'iPhone 16' in d['name']: score += 10
                if 'Pro' in d['name']: score += 1
                candidates.append((score, d['udid'], d['name']))
          if not candidates:
            raise SystemExit('no iPhone simulator on iOS 18+')
          candidates.sort(reverse=True)
          print(candidates[0][1])
          ")
          echo "Using simulator $UDID"
          xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          # Fail fast if the sim never becomes ready (otherwise xcodebuild stalls).
          perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl bootstatus "$UDID" -b
          xcodebuild test \
            -project Dayrule.xcodeproj \
            -scheme Dayrule \
            -destination "platform=iOS Simulator,id=$UDID" \
            -skip-testing:DayruleUITests \
            CODE_SIGNING_ALLOWED=NO
